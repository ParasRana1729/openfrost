name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows-first project: DPAPI and better-sqlite3 prebuilds are exercised
    # on the same platform the owner runs.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Reads the pinned pnpm version from package.json `packageManager`.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
