name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows-first project: DPAPI and better-sqlite3 prebuilds are exercised
    # on the same platform the owner runs.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Reads the pinned pnpm version from package.json `packageManager`.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  tui:
    # S09: the Rust Control Center crate lives outside the pnpm workspace and
    # carries its own checks.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build
