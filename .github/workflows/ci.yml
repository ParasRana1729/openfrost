name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build